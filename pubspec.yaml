name: regayislam
description: ڕێگای ئیسلام — Quran, Prayer Times, Qibla, Azkar and more. Rebuilt from Sketchware Pro to Flutter.
publish_to: "none"
version: 71.0.0+73

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  http: ^1.2.2
  audioplayers: ^6.1.0
  url_launcher: ^6.3.0
  share_plus: ^10.0.2
  flutter_compass: ^0.8.0
  geolocator: ^13.0.1
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  vibration: ^3.1.3
  photo_view: ^0.15.0
  webview_flutter: ^4.8.0
  flutter_pdfview: ^1.3.2
  video_player: ^2.9.2
  home_widget: ^0.8.0
  gal: ^2.3.2
  image_picker: ^1.1.2
  flutter_tts: ^4.2.0
  ffmpeg_kit_flutter_new: ^4.6.8

dependency_overrides:
  home_widget:
    path: vendor/home_widget

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/db/
    - assets/data/
    - assets/images/
    - assets/images/icon/
    - assets/images/qari/
    - assets/fonts/
    - assets/sounds/
  fonts:
    - family: Rabar
      fonts:
        - asset: assets/fonts/rabar.ttf
    - family: Rabar2
      fonts:
        - asset: assets/fonts/rabar2.ttf
    - family: NRT
      fonts:
        - asset: assets/fonts/nrt.ttf
    - family: Rudaw
      fonts:
        - asset: assets/fonts/rudaw.ttf
    - family: Speda
      fonts:
        - asset: assets/fonts/speda.ttf
    - family: Oko
      fonts:
        - asset: assets/fonts/oko.ttf
    - family: Zyad
      fonts:
        - asset: assets/fonts/zyad.ttf
    - family: Quran
      fonts:
        - asset: assets/fonts/quran.ttf
    - family: Quran1
      fonts:
        - asset: assets/fonts/quran1.ttf
    - family: Quran3
      fonts:
        - asset: assets/fonts/quran3.ttf
    - family: Quran5
      fonts:
        - asset: assets/fonts/quran5.ttf
    - family: Quran7
      fonts:
        - asset: assets/fonts/quran7.ttf
    - family: Quran9
      fonts:
        - asset: assets/fonts/quran9.ttf
    - family: Raqam
      fonts:
        - asset: assets/fonts/raqam.ttf
    - family: NumberArabic
      fonts:
        - asset: assets/fonts/numberarabic.ttf
