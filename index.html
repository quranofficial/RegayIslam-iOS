<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ڕێگای ئیسلام</title>
<meta name="description" content="ڕێگای ئیسلام — قورئان، کاتەکانی نوێژ، قیبلەنما، ناوەکانی خودا، ڤیدیۆ، کتێب و زیاتر — وەک ئەپەکە بەخۆڕایی ٢٤/٧">
<meta name="theme-color" content="#004D7B">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- splash: logo + progress only (same as app) -->
<div id="splash"><img src="logo.png" alt="ڕێگای ئیسلام"><div class="spinner"></div></div>

<div id="app" style="display:none">
  <header id="hdr">
    <button class="icbtn" id="hBack" style="display:none" onclick="history.back()"><span class="msr">arrow_forward</span></button>
    <img src="logo.png" alt="" onclick="nav('#/')">
    <div id="hTitle" onclick="nav('#/')">ڕێگای ئیسلام</div>
    <span style="flex:1"></span>
    <button class="icbtn" onclick="shareApp()" title="هاوبەشی ئەپ"><span class="msr">share</span></button>
    <button class="icbtn" id="hTheme" onclick="toggleTheme()"><span class="msr">dark_mode</span></button>
  </header>
  <main id="view"></main>
  <nav id="bnav">
    <button class="active" data-r="#/" onclick="nav('#/')"><span class="msr">home</span><b>سەرەتا</b></button>
    <button data-r="#/quran" onclick="nav('#/quran')"><span class="msr">menu_book</span><b>قورئان</b></button>
    <button data-r="#/tasbih" onclick="nav('#/tasbih')"><span class="msr">fingerprint</span><b>تەسبیح</b></button>
    <button data-r="#/settings" onclick="nav('#/settings')"><span class="msr">settings</span><b>ڕێکخستن</b></button>
  </nav>
</div>

<div class="toast" id="toast"></div>
<div id="sheet" class="sheet" onclick="if(event.target===this)closeSheet()"><div class="sheet-in" id="sheetIn"></div></div>

<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script src="js/views_a.js"></script>
<script src="js/views_b.js"></script>
<script src="js/main.js"></script>
</body>
</html>
