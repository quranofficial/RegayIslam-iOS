name: Build RegayIslam Android APK

on:
  workflow_dispatch:

concurrency:
  group: regayislam-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get Flutter packages
        run: flutter pub get

      - name: Generate Android platform
        run: flutter create --platforms=android --org com.nwezhakanm --project-name regayislam .

      - name: Configure Android package and desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle.kts")
          if not gradle.exists():
              raise SystemExit("Android Gradle file not found")

          text = gradle.read_text()

          if not re.search(r'(?m)^\s*namespace\s*=', text):
              raise SystemExit("namespace declaration not found")
          if not re.search(r'(?m)^\s*applicationId\s*=', text):
              raise SystemExit("applicationId declaration not found")

          text = re.sub(r'(?m)^\s*namespace\s*=\s*"[^"]+"',
                        '    namespace = "com.nwezhakanm"', text, count=1)
          text = re.sub(r'(?m)^\s*applicationId\s*=\s*"[^"]+"',
                        '        applicationId = "com.nwezhakanm"', text, count=1)

          if "isCoreLibraryDesugaringEnabled" not in text:
              text, count = re.subn(r'compileOptions\s*\{',
                                    'compileOptions {\n        isCoreLibraryDesugaringEnabled = true',
                                    text, count=1)
              if count != 1:
                  raise SystemExit("compileOptions block not found")

          if "coreLibraryDesugaring(" not in text:
              text = text.rstrip() + '''

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          '''

          gradle.write_text(text)

          root = Path("android/app/src/main")
          activity = next(root.rglob("MainActivity.kt"), None)
          if activity is None:
              raise SystemExit("MainActivity.kt not found")

          source = re.sub(r'(?m)^package\s+.*$',
                          'package com.nwezhakanm',
                          activity.read_text(), count=1)
          target = root / "kotlin/com/nwezhakanm/MainActivity.kt"
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(source)
          if activity != target:
              activity.unlink()

          print("Configured package com.nwezhakanm and core library desugaring.")
          PY

      - name: Verify Android desugaring configuration
        run: |
          grep -n "isCoreLibraryDesugaringEnabled" android/app/build.gradle.kts
          grep -n "coreLibraryDesugaring" android/app/build.gradle.kts
          grep -n 'applicationId = "com.nwezhakanm"' android/app/build.gradle.kts

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RegayIslam-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
