name: Temporary RegayIslam iOS validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-ios-temp.yml"

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS project
        run: flutter create --platforms=ios --org com.nwezhakanm --project-name regayislam .
      - name: Prepare iOS notification sound
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then brew install ffmpeg; fi
          ffmpeg -hide_banner -loglevel error -y -i assets/sounds/dang.MP3 -t 29 -ac 1 -ar 44100 -c:a pcm_s16le /tmp/adhan.wav
          afconvert -f caff -d LEI16@44100 /tmp/adhan.wav ios/Runner/adhan.caf
      - name: Configure iOS app
        run: python3 scripts/configure_ios.py
      - name: Resolve packages and pods
        run: |
          flutter pub get
          cd ios
          pod install --repo-update
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: RegayIslam-validation-iOS-app
          path: build/ios/iphoneos/Runner.app
