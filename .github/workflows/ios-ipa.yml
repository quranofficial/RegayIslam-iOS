name: Build RegayIslam Unsigned iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS project files
        run: |
          if [ ! -d ios ]; then
            flutter create --platforms=ios --org com.nwezhakanm --project-name regayislam .
          fi
          python3 scripts/configure_ios.py

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS app without code signing
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/ios/iphoneos/Runner.app"
          test -d "$APP_PATH"
          rm -rf build/ios/unsigned-ipa
          mkdir -p build/ios/unsigned-ipa/Payload
          cp -R "$APP_PATH" build/ios/unsigned-ipa/Payload/Runner.app
          cd build/ios/unsigned-ipa
          /usr/bin/zip -qry ../RegayIslam-unsigned.ipa Payload
          test -s ../RegayIslam-unsigned.ipa

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RegayIslam-unsigned-IPA
          path: build/ios/RegayIslam-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
