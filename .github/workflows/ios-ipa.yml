name: Build RegayIslam Unsigned iOS IPA

on:
  push:
    branches:
      - feature/unified-web-platform
  workflow_dispatch:

concurrency:
  group: regayislam-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS project files
        run: |
          if [ ! -d ios ]; then
            flutter create --platforms=ios --org com.nwezhakanm --project-name regayislam .
          fi
          if ! command -v ffmpeg >/dev/null 2>&1; then brew install ffmpeg; fi
          ffmpeg -hide_banner -loglevel error -y -i assets/sounds/dang.MP3 -t 29 -ac 1 -ar 44100 -c:a pcm_s16le /tmp/adhan.wav
          afconvert -f caff -d LEI16@44100 /tmp/adhan.wav ios/Runner/adhan.caf
          python3 scripts/configure_ios.py

      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Run unit tests
        run: flutter test --reporter expanded

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS app without code signing
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/ios/iphoneos/Runner.app"
          test -d "$APP_PATH"
          rm -rf build/ios/unsigned-ipa
          mkdir -p build/ios/unsigned-ipa/Payload
          cp -R "$APP_PATH" build/ios/unsigned-ipa/Payload/Runner.app
          cd build/ios/unsigned-ipa
          /usr/bin/zip -qry ../RegayIslam-unsigned.ipa Payload
          test -s ../RegayIslam-unsigned.ipa

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RegayIslam-unsigned-IPA
          path: build/ios/RegayIslam-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
