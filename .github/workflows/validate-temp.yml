name: Temporary RegayIslam Android validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-temp.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Generate Android platform
        run: flutter create --platforms=android --org com.nwezhakanm --project-name regayislam .
      - name: Prepare Adhan sound and app icon
        run: |
          mkdir -p android/app/src/main/res/raw android/app/src/main/res/drawable-nodpi
          cp assets/sounds/dang.MP3 android/app/src/main/res/raw/adhan.mp3
          cp assets/images/app_icon.png android/app/src/main/res/drawable-nodpi/app_icon.png
      - name: Configure Android manifest and package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          for permission in ("android.permission.POST_NOTIFICATIONS", "android.permission.SCHEDULE_EXACT_ALARM", "android.permission.RECEIVE_BOOT_COMPLETED", "android.permission.ACCESS_FINE_LOCATION", "android.permission.ACCESS_COARSE_LOCATION"):
              if permission not in text:
                  text = re.sub(r'(<manifest[^>]*>)',
                      lambda m: m.group(1) + f'\n    <uses-permission android:name="{permission}" />',
                      text, count=1)
          text = re.sub(r'android:label="[^"]*"', 'android:label="ڕێگای ئیسلام"', text, count=1)
          text = re.sub(r'android:icon="@[^"]+"', 'android:icon="@drawable/app_icon"', text, count=1)
          text = re.sub(r'android:roundIcon="@[^"]+"', 'android:roundIcon="@drawable/app_icon"', text, count=1)
          if "ScheduledNotificationReceiver" not in text:
              receivers = """    <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
              <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                  <intent-filter>
                      <action android:name="android.intent.action.BOOT_COMPLETED" />
                      <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      <action android:name="com.htc.intent.action.QUICKBOOT_POWERON" />
                  </intent-filter>
              </receiver>
          """
              text = text.replace("</application>", receivers + "    </application>", 1)
          manifest.write_text(text)

          gradle = Path("android/app/build.gradle.kts")
          text = gradle.read_text()
          text = re.sub(r'(?m)^\s*namespace\s*=\s*"[^"]+"',
                        '    namespace = "com.nwezhakanm"', text, count=1)
          text = re.sub(r'(?m)^\s*applicationId\s*=\s*"[^"]+"',
                        '        applicationId = "com.nwezhakanm"', text, count=1)
          if "isCoreLibraryDesugaringEnabled" not in text:
              text, count = re.subn(r'compileOptions\s*\{',
                    'compileOptions {\n        isCoreLibraryDesugaringEnabled = true',
                    text, count=1)
              if count != 1:
                  raise SystemExit("compileOptions block not found")
          if "coreLibraryDesugaring(" not in text:
              text = text.rstrip() + '''

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          '''
          gradle.write_text(text)

          root = Path("android/app/src/main")
          activity = next(root.rglob("MainActivity.kt"), None)
          if activity is None:
              raise SystemExit("MainActivity.kt not found")
          source = re.sub(r'(?m)^package\s+.*$', 'package com.nwezhakanm',
                          activity.read_text(), count=1)
          target = root / "kotlin/com/nwezhakanm/MainActivity.kt"
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(source)
          if activity != target:
              activity.unlink()
          PY
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: RegayIslam-validation-APK
          path: build/app/outputs/flutter-apk/app-release.apk
